<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Access restricted</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e5484d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z'/%3E%3Cpath d='M9 9l6 6M15 9l-6 6'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f7;
    --bg-glow: rgba(229, 72, 77, .10);
    --card: #ffffff;
    --card-border: rgba(15, 23, 42, .08);
    --text: #0f172a;
    --muted: #5b6475;
    --faint: #8a93a3;
    --accent: #e5484d;
    --accent-soft: rgba(229, 72, 77, .10);
    --accent-ring: rgba(229, 72, 77, .22);
    --chip: #f1f3f6;
    --row: #f8f9fb;
    --link: #2563eb;
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 12px 40px -12px rgba(15, 23, 42, .18);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f13;
      --bg-glow: rgba(229, 72, 77, .14);
      --card: #16191f;
      --card-border: rgba(255, 255, 255, .07);
      --text: #f1f3f6;
      --muted: #a3abb8;
      --faint: #6f7785;
      --accent: #ff6369;
      --accent-soft: rgba(255, 99, 105, .12);
      --accent-ring: rgba(255, 99, 105, .25);
      --chip: #1f232b;
      --row: #1b1f26;
      --link: #7aa7ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 24px 60px -20px rgba(0, 0, 0, .6);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 50% -10%, var(--bg-glow), transparent 70%),
      var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 32px;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 560px;
    margin: auto 0;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 40px 36px 28px;
    text-align: center;
    animation: rise .5s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

  .badge {
    width: 76px; height: 76px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent-soft) 45%, transparent);
  }
  .badge svg { width: 36px; height: 36px; }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .lead {
    margin: 0 auto;
    max-width: 380px;
    color: var(--muted);
  }

  .site {
    margin: 24px 0 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--row);
    border: 1px solid var(--card-border);
    text-align: left;
  }
  .site-icon {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 9px;
    display: grid; place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .site-icon svg { width: 18px; height: 18px; }
  .site-meta { min-width: 0; flex: 1; }
  .site-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .site-url {
    font-family: var(--mono);
    font-size: 14px;
    overflow-wrap: anywhere;
  }

  .chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center;
    margin-top: 14px;
  }
  .chips:empty { display: none; }
  .chip {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--muted);
    border: 1px solid var(--card-border);
  }

  .radar {
    margin: 18px 0 0;
    font-size: 13.5px;
    color: var(--muted);
  }
  .radar a { color: var(--link); text-decoration: none; font-weight: 500; }
  .radar a:hover { text-decoration: underline; }

  details {
    margin-top: 26px;
    border-top: 1px solid var(--card-border);
    padding-top: 14px;
    text-align: left;
  }
  summary {
    list-style: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    padding: 4px 2px;
    border-radius: 6px;
  }
  summary::-webkit-details-marker { display: none; }
  summary .chev { transition: transform .2s; width: 16px; height: 16px; }
  details[open] summary .chev { transform: rotate(180deg); }
  summary:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent-ring);
    outline-offset: 2px;
  }

  dl {
    margin: 12px 0 0;
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 1px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    background: var(--card-border);
  }
  dt, dd {
    margin: 0;
    padding: 8px 12px;
    background: var(--row);
    font-size: 12.5px;
  }
  dt { color: var(--faint); white-space: nowrap; }
  dd {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    overflow-wrap: anywhere;
  }

  .actions { display: flex; justify-content: flex-end; margin-top: 10px; }
  button.copy {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text);
    background: var(--chip);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button.copy:hover { border-color: var(--accent-ring); }
  button.copy svg { width: 14px; height: 14px; }

  footer {
    margin-top: 22px;
    font-size: 12px;
    color: var(--faint);
    text-align: center;
  }

  @media (max-width: 480px) {
    body { padding-top: 24px; }
    .card { padding: 32px 20px 22px; border-radius: 16px; }
    h1 { font-size: 24px; }
    dl { grid-template-columns: 1fr; }
    dt { padding-bottom: 0; }
    dd { padding-top: 2px; }
  }
</style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="title">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/>
        <circle cx="12" cy="12" r="3"/>
        <path d="M4 20 20 4"/>
      </svg>
    </div>

    <h1 id="title">Access restricted</h1>
    <p class="lead">This site is blocked. Please contact your administrator for further assistance.</p>

    <div class="site" id="site" hidden>
      <div class="site-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/>
        </svg>
      </div>
      <div class="site-meta">
        <div class="site-label">Site</div>
        <div class="site-url" id="site-url"></div>
      </div>
    </div>

    <div class="chips" id="chips"></div>

    <p class="radar" id="radar" hidden>
      Look up this site on
      <a id="radar-link" href="https://radar.cloudflare.com/" target="_blank" rel="noopener noreferrer">Cloudflare Radar</a>
      for more information.
    </p>

    <details id="details" open>
      <summary>
        <span>Technical details</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <dl id="info"></dl>
      <div class="actions">
        <button type="button" class="copy" id="copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          <span id="copy-label">Copy details</span>
        </button>
      </div>
    </details>
  </section>

  <footer>Protected by Cloudflare Gateway</footer>
</main>

<script>
(function () {
  // Policy context that Cloudflare Gateway appends to the redirect URL
  // when "Send policy context" is turned on.
  var params = new URLSearchParams(location.search);
  var get = function (k) { var v = params.get(k); return v ? v.trim() : ""; };

  var siteUri = get("cf_site_uri");
  var categories = get("cf_request_categories") || get("cf_request_category_names");
  var filters = { http: "HTTP policy", dns: "DNS policy", av: "Antivirus", l4: "Network policy" };

  // Site
  if (siteUri) {
    document.getElementById("site-url").textContent = siteUri;
    document.getElementById("site").hidden = false;
    document.title = "Access restricted · " + hostOf(siteUri);

    var host = hostOf(siteUri);
    if (/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(host)) {
      document.getElementById("radar-link").href =
        "https://radar.cloudflare.com/domains/domain/" + encodeURIComponent(host);
      document.getElementById("radar").hidden = false;
    }
  }

  // Category / application chips
  var chips = document.getElementById("chips");
  var app = get("cf_application_name");
  if (app) addChip(app);
  if (categories) categories.split(",").forEach(function (c) { if (c.trim()) addChip(c.trim()); });

  // Technical details (only rows that have a value are shown)
  var now = new Date();
  var rows = [
    ["Rule ID", get("cf_rule_id")],
    ["Source IP", get("cf_source_ip")],
    ["Time", formatTime(now)],
    ["Blocked by", filters[get("cf_filter")] || get("cf_filter")],
    ["Account ID", get("cf_account_id")],
    ["User", get("cf_user_email")],
    ["Device ID", get("cf_device_id")],
    ["Request ID", get("cf_request_id")],
    ["Query ID", get("cf_query_id")],
    ["Connection ID", get("cf_connection_id")]
  ].filter(function (r) { return r[1]; });

  var dl = document.getElementById("info");
  rows.forEach(function (r) {
    var dt = document.createElement("dt"); dt.textContent = r[0];
    var dd = document.createElement("dd"); dd.textContent = r[1];
    dl.appendChild(dt); dl.appendChild(dd);
  });

  // Copy details for a support ticket
  var copyBtn = document.getElementById("copy");
  var copyLabel = document.getElementById("copy-label");
  copyBtn.addEventListener("click", function () {
    var text = (siteUri ? ["Site: " + siteUri] : [])
      .concat(rows.map(function (r) { return r[0] + ": " + r[1]; }))
      .join("\n");
    copyText(text).then(function () {
      copyLabel.textContent = "Copied";
    }, function () {
      copyLabel.textContent = "Copy failed";
    }).then(function () {
      setTimeout(function () { copyLabel.textContent = "Copy details"; }, 1800);
    });
  });

  function addChip(text) {
    var s = document.createElement("span");
    s.className = "chip";
    s.textContent = text;
    chips.appendChild(s);
  }

  function hostOf(uri) {
    try { return new URL(/^[a-z]+:\/\//i.test(uri) ? uri : "https://" + uri).hostname; }
    catch (e) { return uri; }
  }

  function formatTime(d) {
    var date = d.toLocaleDateString("en-US", { timeZone: "UTC", month: "long", day: "numeric", year: "numeric" });
    var time = d.toLocaleTimeString("en-US", { timeZone: "UTC", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true });
    return date + " at " + time + " UTC";
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }
})();
</script>
</body>
</html>
