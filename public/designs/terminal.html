<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Access restricted</title>
<style>
  :root {
    --bg: #07090c;
    --panel: #0c1016;
    --line: #1c232d;
    --text: #c9d1d9;
    --dim: #5c6773;
    --red: #ff5f56;
    --amber: #ffbd2e;
    --green: #27c93f;
    --cyan: #56d4dd;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
      radial-gradient(1000px 600px at 50% 0%, rgba(255, 95, 86, .08), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 14px/1.7 var(--mono);
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }
  .win {
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 95, 86, .06);
    overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: #0a0d12;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .bar .title { margin-left: 10px; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .body { padding: 26px 26px 22px; }

  .prompt { color: var(--dim); }
  .prompt b { color: var(--green); font-weight: 500; }
  .out { margin: 2px 0 18px; }

  .status {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 4px;
    background: rgba(255, 95, 86, .14);
    color: var(--red);
    font-weight: 700;
  }
  h1 {
    margin: 14px 0 4px;
    font-size: clamp(26px, 6vw, 40px);
    line-height: 1.1;
    font-weight: 700;
    color: #fff;
    letter-spacing: -.02em;
  }
  h1 .cursor {
    display: inline-block;
    width: .5em; height: .9em;
    margin-left: 6px;
    vertical-align: -.08em;
    background: var(--red);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { h1 .cursor { animation: none; } }

  .msg { color: var(--text); margin: 0 0 22px; }
  .site { color: var(--amber); overflow-wrap: anywhere; }
  .cat { color: var(--cyan); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 3px 0; vertical-align: top; }
  td.k { color: var(--dim); white-space: nowrap; padding-right: 18px; width: 1%; }
  td.k::after { content: " ="; }
  td.v { overflow-wrap: anywhere; word-break: break-all; }

  .foot {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between;
    margin-top: 22px; padding-top: 16px;
    border-top: 1px dashed var(--line);
    color: var(--dim); font-size: 12.5px;
  }
  a { color: var(--cyan); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button {
    font: inherit; font-size: 12.5px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--green); color: var(--green); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  @media (max-width: 520px) {
    .body { padding: 20px 16px 18px; }
    td.k { display: block; padding: 6px 0 0; }
    td.v { display: block; }
    tr { display: block; }
  }
</style>
</head>
<body>
<main class="win" aria-labelledby="title">
  <div class="bar" aria-hidden="true">
    <span class="dot" style="background:var(--red)"></span>
    <span class="dot" style="background:var(--amber)"></span>
    <span class="dot" style="background:var(--green)"></span>
    <span class="title" id="bar-title">gateway — request blocked</span>
  </div>
  <div class="body">
    <div class="prompt"><b>gateway</b>:~$ connect <span class="site" id="site-cmd">site</span></div>
    <div class="out"><span class="status">403 BLOCKED</span></div>

    <h1 id="title">Access restricted<span class="cursor" aria-hidden="true"></span></h1>
    <p class="msg">This site is blocked. Please contact your administrator for further assistance.</p>

    <table>
      <tbody id="rows"></tbody>
    </table>

    <div class="foot">
      <span id="radar" hidden># Look up this site on <a id="radar-link" target="_blank" rel="noopener noreferrer">Cloudflare Radar</a> for more information.</span>
      <button type="button" id="copy"><span id="copy-label">copy --details</span></button>
    </div>
  </div>
</main>

<script src="context.js"></script>
<script>
(function () {
  var c = window.BlockContext;
  var tbody = document.getElementById("rows");

  document.getElementById("site-cmd").textContent = c.host || "site";
  if (c.host) document.getElementById("bar-title").textContent = "gateway — " + c.host;

  function addRow(k, v, cls) {
    var tr = document.createElement("tr");
    var tk = document.createElement("td"); tk.className = "k"; tk.textContent = k;
    var tv = document.createElement("td"); tv.className = "v" + (cls ? " " + cls : ""); tv.textContent = v;
    tr.appendChild(tk); tr.appendChild(tv); tbody.appendChild(tr);
  }
  if (c.siteUri) addRow("site", c.siteUri, "site");
  if (c.categories.length) addRow("category", c.categories.join(", "), "cat");
  c.rows.forEach(function (r) { addRow(r[0].toLowerCase().replace(/ /g, "_"), r[1]); });

  if (c.radarUrl) {
    document.getElementById("radar-link").href = c.radarUrl;
    document.getElementById("radar").hidden = false;
  }
  c.bindCopy(document.getElementById("copy"), document.getElementById("copy-label"), "copy --details");
})();
</script>
</body>
</html>
